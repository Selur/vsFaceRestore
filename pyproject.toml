[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vsfacerestore"
version = "0.0.1"
description = "Temporal video face restoration (DicFace, KEEP) for VapourSynth"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "vsfacerestore/facexlib/LICENSE"]
authors = [{ name = "Selur" }]
keywords = ["VapourSynth", "face restoration", "DicFace", "KEEP", "PyTorch"]
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "einops",
  "numpy",
  "opencv-python",
  "scipy",
  "torch>=2.5",
  "torchvision>=0.20",
  "VapourSynth>=66",
]

# the wheel ships the weights (about 1.7 GB); artifacts overrides the .gitignore rule that keeps them out of git
[tool.hatch.build.targets.wheel]
packages = ["vsfacerestore"]
artifacts = ["vsfacerestore/models/**/*.pth"]

[tool.hatch.build.targets.sdist]
exclude = ["vsfacerestore/models/**/*.pth", "test/", "docs/"]
